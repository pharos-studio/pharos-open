<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="title desc">
<title id="title">决策链路 · 状态输出目标结构</title>
<desc id="desc">输入、正式策略路由、市场判断与证据、交易约束、最终展示。末端为状态与证据，不按综合分分段。这是目标结构，尚未全量实现；当前非红利评分策略保留综合分，旧红利已停用，新双路径未上线。</desc>
<defs>
<radialGradient id="halo"><stop stop-color="#7C8CF8" stop-opacity=".16"/><stop offset="1" stop-color="#7C8CF8" stop-opacity="0"/></radialGradient>
<radialGradient id="goldHalo"><stop stop-color="#D9A441" stop-opacity=".08"/><stop offset="1" stop-color="#D9A441" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D9A441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;fill:#EDEFF7}
.title,.heading{font-family:"Songti SC",STSong,"Noto Serif CJK SC","Source Han Serif SC",SimSun,Georgia,serif;font-weight:600}
.title{font-size:30px}.heading{font-size:24px}.body{font-size:20px}.note{font-size:18px;fill:#9AA3C0}.label{font-size:17px;letter-spacing:1px;fill:#D9A441}
.panel{fill:white;fill-opacity:.05;stroke:#D9A441;stroke-opacity:.22;stroke-width:1.3}
.line{fill:none;stroke:#D9A441;stroke-opacity:.7;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
</style>
<rect width="900" height="1280" rx="12" fill="#0A1020"/>
<ellipse cx="230" cy="0" rx="800" ry="500" fill="url(#halo)"/><ellipse cx="840" cy="0" rx="450" ry="350" fill="url(#goldHalo)"/>
<rect x="36" y="36" width="5" height="44" rx="2" fill="#D9A441"/>
<text x="56" y="48" class="label">PHAROS / 决策总框架</text>
<text x="56" y="88" class="title">从策略判断，到状态与证据</text>
<rect x="674" y="40" width="190" height="36" rx="7" class="panel"/>
<text x="769" y="64" text-anchor="middle" class="label">目标结构 · 未全量实现</text>
<text x="36" y="128" class="note">当前：非红利评分策略保留综合分；旧红利已停用，新双路径未上线</text>
<g data-panel="输入">
<rect x="60" y="168" width="780" height="130" rx="12" class="panel"/>
<text x="84" y="206" class="heading">01 / 输入 · 先准备可用数据</text>
<text x="84" y="245" class="body">基金档案、下单前已可获知的净值及估值、配置与时间</text>
<text x="84" y="275" class="note">数据获取与存储属于服务层；算法只接收准备好的输入</text>
</g>
<path d="M450 298V342" class="line"/>
<g data-panel="正式策略路由">
<rect x="60" y="344" width="780" height="144" rx="12" class="panel"/>
<text x="84" y="383" class="heading">02 / 正式策略路由 · 选择自己的规则</text>
<text x="84" y="422" class="body">按分类、口径及专线身份，进入对应的独立策略</text>
<text x="84" y="455" class="note">规则停用、档案待确认、待建设 → 暂不判定，不伪造市场结论</text>
</g>
<path d="M450 488V532" class="line"/>
<path d="M840 416H875V997H842" class="line" stroke-dasharray="6 5"/>
<g data-panel="市场判断与证据">
<rect x="60" y="534" width="780" height="150" rx="12" class="panel"/>
<text x="84" y="573" class="heading">03 / 市场判断 · 看条件，也看证据</text>
<text x="84" y="612" class="body">各策略独立判断，保留触发路径、关键指标与原因</text>
<text x="84" y="645" class="note">不强制所有算法共用四步或 kernel；必要数据不足 → 无法判定</text>
<text x="84" y="671" class="note">参考指标旁列，不自动变成买入前提；状态不按综合分划区间</text>
</g>
<path d="M450 684V728" class="line"/>
<g data-panel="交易约束">
<rect x="60" y="730" width="780" height="145" rx="12" class="panel"/>
<text x="84" y="769" class="heading">04 / 交易约束 · 市场机会不等于能够申购</text>
<text x="84" y="808" class="body">检查申购状态与有效期、用户限额及现有政策约束</text>
<text x="84" y="841" class="note">交易受限仍保留市场判断；最终 verdict 与 executable 分开表达</text>
</g>
<path d="M450 875V919" class="line"/>
<g data-panel="最终展示">
<rect x="60" y="921" width="780" height="262" rx="12" class="panel"/>
<text x="84" y="960" class="heading">05 / 最终展示 · 状态 ＋ 关键证据 ＋ 可执行性</text>
<text x="84" y="1000" class="body">市场状态：等待机会 / 机会观察 / 可加仓</text>
<text x="84" y="1032" class="note">只显示策略确实定义的状态，不强求每条策略都有“机会观察”</text>
<text x="84" y="1072" class="body">独立说明：暂不判定 / 数据不足 / 规则拦截 / 交易受限</text>
<text x="84" y="1104" class="note">能够判断市场时，展示原始指标、触发路径及限制原因</text>
<text x="84" y="1144" class="body">可加仓是市场判断，不是自动下单或建议购买金额</text>
</g>
<text x="36" y="1230" class="note">实线：正常判断链路　虚线：不可判断时旁路展示　各策略细节见独立图</text>
</svg>
