<svg viewBox="0 0 800 592" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>决策分配算法模型 · 决策链路全景</title>
<desc>从数据输入到 registry（按类别+口径）注册、五套策略并排、内核四步、综合分合成到输出决策卡的完整链路。2026-09-14 起位置分重构为 V 估值分 + M 动量分 双轨（动量因子由二值改连续，add/hold 判定完全不动）。2026-09-12 起宽基内部分 caliber（A股 cn / 海外 us），海外口径（纳指100）为独立策略线，与 A股口径并排展示。</desc>
