<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1230" width="900" height="1230" role="img" aria-labelledby="title desc">
<title id="title">黄金 · 每月定投与宏观政策阅读（已启用）</title>
<desc id="desc">gold-monthly-dca-v1先核验当前官方基金身份，提供每月定投手动执行状态。每日复盘展开黄金条目直接阅读近期官方政策，用户自行决定手动执行。系统不指定日期、金额或完成度；政策失败不影响计划，申购和资金限制独立显示。月计划已启用，旧量化门禁保持关闭。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA3C0" stroke-width="1.6"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;fill:#EDEFF7;font-weight:600}.heading{font-size:23px;fill:#D9A441}.body{font-size:20px;fill:#EDEFF7}.note{font-size:18px;fill:#9AA3C0}.panel{fill:#FFFFFF;fill-opacity:.05;stroke:#D9A441;stroke-opacity:.65;stroke-width:1.3}.line{fill:none;stroke:#9AA3C0;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="900" height="1230" rx="12" fill="#0A1020"/>
<text x="36" y="55" class="heading">PHAROS / 黄金 · G0</text>
<text x="36" y="105" class="title">每月定投；由你决定是否执行</text>
<text x="36" y="145" class="note">gold-monthly-dca-v1 · 月计划已启用 · 无择时判断或综合分</text>
<rect x="36" y="180" width="828" height="145" rx="12" class="panel"/>
<text x="60" y="220" class="heading">当前官方身份与范围</text>
<text x="60" y="260" class="body">国内人民币场外黄金 ETF 联接，七份额分别核验</text>
<text x="60" y="297" class="note">资料不足进入问题区；不依赖旧 A/B 历史预热，不代表实际可申购</text>
<path d="M450 325V365" class="line"/>
<rect x="36" y="370" width="400" height="190" rx="12" class="panel"/>
<text x="60" y="413" class="heading">每月定投计划</text>
<text x="60" y="455" class="body">不指定日期或金额</text>
<text x="60" y="491" class="body">不跟踪当月完成度</text>
<text x="60" y="531" class="note">申购状态与资金限制独立提示</text>
<rect x="464" y="370" width="400" height="190" rx="12" class="panel"/>
<text x="488" y="413" class="heading">每日复盘 · 展开直接阅读</text>
<text x="488" y="455" class="body">五经济体；30 / 90 / 180 天</text>
<text x="488" y="491" class="body">机构、日期、简洁机制解读与原文</text>
<text x="488" y="531" class="note">部分或过期不改变月计划</text>
<path d="M236 560V600H664V560M450 600V640" class="line"/>
<rect x="36" y="645" width="828" height="120" rx="12" class="panel"/>
<text x="60" y="690" class="heading">用户自主决定 · 手动申购</text>
<text x="60" y="730" class="body">阅读政策、核查渠道申购条件后，由你决定是否执行</text>
<path d="M450 765V805" class="line"/>
<rect x="36" y="810" width="828" height="150" rx="12" class="panel"/>
<text x="60" y="853" class="heading">黄金状态默认收起 · 每月定投，手动执行</text>
<text x="60" y="894" class="body">展开看政策改变、条件性影响与相反因素</text>
<text x="60" y="934" class="note">不新增黄金月度流水或完成率；原红利月度复盘保留</text>
<text x="36" y="1013" class="body">政策只供阅读：决定、提案、纪要、讲话与数据分别标识。</text>
<text x="36" y="1057" class="note">无可靠原文锚则不解读；更多筛选与原始依据按需展开。</text>
<text x="36" y="1101" class="note">旧 gold-dual-v1 与旧门禁独立保留；明确旧版本维护仍受原门禁约束。</text>
<text x="36" y="1145" class="note">仅启用月计划；回滚关闭新开关时沿旧路由，旧量化仍不启用。</text>
<text x="36" y="1190" class="heading">无自动下单 · 白银／原油及其他策略保持原行为</text>
</svg>
