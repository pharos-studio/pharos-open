<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1590" width="900" height="1590" role="img" aria-labelledby="title desc">
<title id="title">国内黄金 · 双路径工程候选（待启用）</title>
<desc id="desc">gold-dual-v1：基金自身完整经济复权链投影到经核验日频净值，日Wilder RSI14。A回撤修复129日完整指标，B趋势回踩250日，路径内且、路径间三值或。七份额真实证据尚未全部通过，可执行零；默认启用门禁关闭。不是所有商品规则，不含卖出、补仓或28日冷却。</desc>
<defs><radialGradient id="halo"><stop stop-color="#7C8CF8" stop-opacity=".16"/><stop offset="1" stop-color="#7C8CF8" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA3C0" stroke-width="1.6"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title,.heading{font-family:"Songti SC",STSong,SimSun,Georgia,serif;fill:#EDEFF7;font-weight:600}.title{font-size:30px}.heading{font-size:23px}.body{font-size:20px;fill:#EDEFF7}.note{font-size:18px;fill:#9AA3C0}.label{font-size:17px;fill:#D9A441;letter-spacing:1px}.panel{fill:#FFFFFF;fill-opacity:.05;stroke:#D9A441;stroke-opacity:.65;stroke-width:1.3}.line{fill:none;stroke:#9AA3C0;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.connector{fill:none;stroke:#9AA3C0;stroke-width:2}</style>
<rect width="900" height="1590" rx="12" fill="#0A1020"/><ellipse cx="200" cy="0" rx="800" ry="500" fill="url(#halo)"/>
<rect x="36" y="36" width="5" height="44" rx="2" fill="#D9A441"/><text x="56" y="48" class="label">PHAROS / 国内黄金 · G0</text><text x="56" y="99" class="title">回撤修复 或 趋势回踩</text><text x="36" y="141" class="note">gold-dual-v1 · 工程候选，尚未启用 · 日 RSI14，不输出综合分或 V/M</text>
<rect x="36" y="168" width="828" height="180" rx="12" class="panel"/><text x="60" y="208" class="heading">先核验身份、完整净值与日频日期</text><text x="60" y="248" class="body">首批七个场外份额；各自净值，不借用 ETF 或其他份额</text><text x="60" y="281" class="body">查看时点已可知净值先过滤再计算；缺口后重新积累</text><text x="60" y="317" class="note">官方身份快照不等于当前证据全齐；实际可执行 0／7，未核不回落旧规则</text>
<path d="M450 348V388M230 388H670M230 388V419M670 388V419" class="connector"/>
<rect x="36" y="420" width="400" height="300" rx="12" class="panel"/><text x="60" y="460" class="heading">A · 回撤修复</text><text x="60" y="499" class="body">完整指标需 129 个有效日</text><text x="60" y="543" class="body">BIAS120 ≤−5%</text><text x="60" y="581" class="body">距近10日最低 BIAS120</text><text x="60" y="611" class="body">修复 ≥1 个百分点</text><text x="60" y="651" class="body">日 RSI14 严格回升且 ≤55</text><text x="60" y="694" class="note">本路径全部条件同时成立</text>
<rect x="464" y="420" width="400" height="300" rx="12" class="panel"/><text x="488" y="460" class="heading">B · 趋势回踩</text><text x="488" y="499" class="body">完整指标需 250 个有效日</text><text x="488" y="537" class="body">净值 &gt; MA250；MA60 &gt; MA250</text><text x="488" y="574" class="body">60 日回撤 3%～10%</text><text x="488" y="611" class="body">近10日低点恢复 ≥1.5%</text><text x="488" y="648" class="body">BIAS60 ≤2%</text><text x="488" y="680" class="body">日 RSI14 45～65 且严格回升</text>
<path d="M236 720V757H664V720M450 757V796" class="line"/>
<rect x="36" y="798" width="828" height="170" rx="12" class="panel"/><text x="60" y="839" class="heading">三值合并 · 任一路成立只形成一个候选</text><text x="60" y="879" class="body">任一路真 → 可加仓；两路假 → 等待机会；其余 → 无法判定</text><text x="60" y="917" class="body">路径内已知假优先；路径间真优先，未知不被兜底为等待</text><text x="60" y="950" class="note">A 成立不强加 B 的 250 日预热；250日净值位置仅参考，不作为门槛</text>
<path d="M450 968V1006" class="line"/>
<rect x="36" y="1008" width="828" height="185" rx="12" class="panel"/><text x="60" y="1049" class="heading">申请日复核／首步可知性口径说明</text><text x="60" y="1089" class="body">分别核验基金工作、估值、申购日；不能用市场代理冒充</text><text x="60" y="1127" class="body">无可靠公告时刻：观察日后第二个核验工作日 14:00 可知</text><text x="60" y="1164" class="note">保守软件约定，不是官方发布时间；15:00 后或未来申请日需届时复核</text>
<path d="M450 1193V1231" class="line"/>
<rect x="36" y="1234" width="828" height="175" rx="12" class="panel"/><text x="60" y="1275" class="heading">执行约束与待启用门禁（市场判断保留）</text><text x="60" y="1315" class="body">暂停、状态过期、用户零限额和原有政策独立拦截执行</text><text x="60" y="1353" class="body">默认待启用；先工程验收与独立终审，再由用户确认范围</text><text x="60" y="1390" class="note">新复盘独立版本；30个日频复权观察、费用未计；真实缺证据仍 pending</text>
<text x="36" y="1454" class="body">两路可能亏损；趋势回踩可能处于相对高位，长期盈利不等于买得低。</text><text x="36" y="1498" class="note">A 长期成熟市场事件仅 7；018391／018392 长期数据不足，历史不保证未来。</text><text x="36" y="1541" class="label">只判断买入 · 无卖出、补仓、金额建议或线上 28 日冷却 · 其他商品不改</text>
</svg>
