<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1570" width="900" height="1570" role="img" aria-labelledby="title desc">
<title id="title">国内主动权益 · 仅买入判断</title>
<desc id="desc">active-equity-buy-v1：基金自身分红再投资复权净值，日RSI14，A回撤修复和B趋势回踩独立预热、三值或。身份与日频采样尚未全部核验，六个已登记实际份额目前可判定为零。候选不等于可执行，不含卖出、補仓或资金循环。</desc>
<defs><radialGradient id="halo"><stop stop-color="#7C8CF8" stop-opacity=".16"/><stop offset="1" stop-color="#7C8CF8" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA3C0" stroke-width="1.6"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title,.heading{font-family:"Songti SC",STSong,SimSun,Georgia,serif;fill:#EDEFF7;font-weight:600}.title{font-size:30px}.heading{font-size:23px}.body{font-size:20px;fill:#EDEFF7}.note{font-size:18px;fill:#9AA3C0}.label{font-size:17px;fill:#D9A441;letter-spacing:1px}.panel{fill:#FFFFFF;fill-opacity:.05;stroke:#D9A441;stroke-opacity:.65;stroke-width:1.3}.line{fill:none;stroke:#9AA3C0;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.connector{fill:none;stroke:#9AA3C0;stroke-width:2}</style>
<rect width="900" height="1570" rx="12" fill="#0A1020"/><ellipse cx="200" cy="0" rx="800" ry="500" fill="url(#halo)"/>
<rect x="36" y="36" width="5" height="44" rx="2" fill="#D9A441"/><text x="56" y="48" class="label">PHAROS / 独立策略 · G0</text><text x="56" y="99" class="title">国内主动权益 · 回撤修复与趋势回踩</text><text x="36" y="141" class="note">冻结 active-equity-buy-v1 · 仅买入判断 · 原始精度，不输出综合分或 V/M</text>
<rect x="36" y="168" width="828" height="180" rx="12" class="panel"/><text x="60" y="208" class="heading">先核验身份、采样与数据</text><text x="60" y="248" class="body">官方国内场外主动权益份额；完整自身净值、分红与拆分</text><text x="60" y="281" class="body">固定序列起点递推 Wilder 日 RSI14；日频规则及连续覆盖分别核验</text><text x="60" y="317" class="note">当前六个实际登记份额可判定 0：五份身份快照已核验，全部日频采样待核</text>
<path d="M450 348V388M230 388H670M230 388V419M670 388V419" class="connector"/>
<rect x="36" y="420" width="400" height="310" rx="12" class="panel"/><text x="60" y="460" class="heading">A · 回撤修复</text><text x="60" y="499" class="body">120 个有效净值日独立预热</text><text x="60" y="542" class="body">120 日回撤 ≥15%</text><text x="60" y="580" class="body">BIAS120 ≤−8%</text><text x="60" y="618" class="body">距近 10 日低点恢复 ≥2%</text><text x="60" y="656" class="body">日 RSI14 严格高于前一期且 ≤55</text><text x="60" y="700" class="note">本通道全部条件同时成立</text>
<rect x="464" y="420" width="400" height="310" rx="12" class="panel"/><text x="488" y="460" class="heading">B · 趋势回踩</text><text x="488" y="499" class="body">270 个有效净值日独立预热</text><text x="488" y="537" class="body">净值 &gt; MA250 且 MA60 &gt; MA250</text><text x="488" y="570" class="body">MA250 &gt; 20 个有效日前的 MA250</text><text x="488" y="603" class="body">60 日回撤 5%～15%</text><text x="488" y="636" class="body">近10日低点恢复 ≥2%；BIAS60 ≤0%</text><text x="488" y="669" class="body">日 RSI14 为 40～60 且严格回升</text><text x="488" y="700" class="note">本通道全部条件同时成立</text>
<path d="M236 730V767H664V730M450 767V806" class="line"/>
<rect x="36" y="808" width="828" height="165" rx="12" class="panel"/><text x="60" y="849" class="heading">三值或 · 通道间独立判断</text><text x="60" y="889" class="body">任一路真 → 可考虑买入；两路有效假 → 等待机会</text><text x="60" y="927" class="body">其余 → 无法判定；A 已成立时不强加 B 的 270 日预热</text><text x="60" y="955" class="note">身份或起点未证：档案待确认；缺数据、未核采样不能冒充等待</text>
<path d="M450 973V1011" class="line"/>
<rect x="36" y="1014" width="828" height="175" rx="12" class="panel"/><text x="60" y="1055" class="heading">申请日期与实际可知上界</text><text x="60" y="1095" class="body">北京时间 15:00 分界；未来申请日必须届时重新核验</text><text x="60" y="1133" class="body">无可靠公告时刻：净值日后第二个核验 CN 开市日 18:00 可知</text><text x="60" y="1170" class="note">这是保守运行政策，不是历史实际公告时间；超 14 日、缺应有观察则不可判定</text>
<path d="M450 1189V1226" class="line"/>
<rect x="36" y="1230" width="828" height="175" rx="12" class="panel"/><text x="60" y="1271" class="heading">市场候选 ≠ 可执行申购</text><text x="60" y="1311" class="body">申购暂停、状态过期、用户限额和现有政策独立约束执行</text><text x="60" y="1349" class="body">分析与建议复用同次判断；拦截保留市场结果，不回落旧行业规则</text><text x="60" y="1386" class="note">新复盘单独版本；首有效运行只建基线，未知及交易拦截不补造转折</text>
<text x="36" y="1456" class="body">仅记录信号结束，不是赎回指令。没有卖出、补仓、到账循环或 28 日冷却。</text><text x="36" y="1500" class="note">金额与节奏由你决定；买入候选不承诺保本或未来盈利。</text><text x="36" y="1536" class="label">PHAROS / 本地工程接入 · 实际证据门禁保留</text>
</svg>
